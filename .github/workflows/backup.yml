# Nightly backup of the live ERP database (01:00 Nairobi), encrypted, kept 30 days as a workflow artifact.
# Needs two repository secrets (Settings → Secrets and variables → Actions), set by the owner:
#   ERP_DATABASE_URL   Neon → Connect → the direct (not "pooled") connection string of the live database
#   BACKUP_PASSPHRASE  a long passphrase, kept somewhere safe off GitHub (needed to restore)
# Restoring is in docs/OPERATIONS.md.
name: Backup

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAW_URL: ${{ secrets.ERP_DATABASE_URL }}
      PASS: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$RAW_URL" ] || [ -z "$PASS" ]; then echo "::error::Set ERP_DATABASE_URL and BACKUP_PASSPHRASE (see the top of this file)."; exit 1; fi
          # Tidy what was pasted (spaces, quotes, line breaks), then say what's wrong without printing it:
          # only the host and port are shown.
          url="$(printf '%s' "$RAW_URL" | tr -d '\r\n' | sed -E "s/^[\"' ]+//; s/[\"' ]+\$//")"
          echo "::add-mask::$url"
          case "$url" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::ERP_DATABASE_URL must start with postgresql:// — copy the connection string from Neon → Connect."; exit 1;;
          esac
          if printf '%s' "$url" | grep -q '[$]{'; then echo "::error::ERP_DATABASE_URL still has placeholders in it: copy the full connection string."; exit 1; fi
          hostport="$(printf '%s' "$url" | sed -E 's#^[a-z]+://##; s#^[^@/]*@##; s#[/?].*$##')"
          echo "Database host: $hostport"
          case "$hostport" in
            ""|:*) echo "::error::ERP_DATABASE_URL has no host in it."; exit 1;;
          esac
          echo "DB_URL=$url" >> "$GITHUB_ENV"
      - name: Install pg_dump 18 (reads any older server too)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
      - name: Dump and encrypt
        run: |
          name="kabuor-erp-$(date -u +%Y-%m-%dT%H%MZ)"
          /usr/lib/postgresql/18/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --file "$name.dump"
          test -s "$name.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 --output "$name.dump.gpg" "$name.dump"
          rm "$name.dump"
          echo "NAME=$name" >> "$GITHUB_ENV"
          ls -lh "$name.dump.gpg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
