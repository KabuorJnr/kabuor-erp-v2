# Every push and pull request: the whole test suite on SQLite and on PostgreSQL (the production database, with
# the EF migrations), the web app's type check and build, and a check for packages with known vulnerabilities.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ERP_TEST_PG: ${{ matrix.db == 'postgres' && 'Host=localhost;Port=5432;Username=postgres;Password=postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Test
        # A test stuck for 5 minutes is stopped and named in the log, instead of the job silently running out of time.
        run: dotnet test --no-restore --logger "console;verbosity=normal" --blame-hang-timeout 5m --blame-hang-dump-type none
      - name: Models and migrations agree
        if: matrix.db == 'postgres'
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations has-pending-model-changes --project src/Kabuor.Erp.Api
      - name: Vulnerable packages
        if: matrix.db == 'sqlite'
        run: |
          dotnet list package --vulnerable --include-transitive | tee vuln.txt
          ! grep -E "^\s+>\s.*(High|Critical)" vuln.txt

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Vulnerable packages
        run: npm audit --audit-level=high --omit=dev
